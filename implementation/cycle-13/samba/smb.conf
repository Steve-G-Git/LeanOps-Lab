[global]
    server string = LeanOps-Lab File Server
    server role = standalone server
    security = user
    server min protocol = SMB2
    server smb transports = 445
    interfaces = lo enp0s8
    bind interfaces only = yes
    hosts allow = 127.0.0.1 192.168.244.0/24
    hosts deny = all
    disable netbios = yes
    disable spoolss = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    dns proxy = no
    logging = file
    log file = /var/log/samba/log.%m
    max log size = 1000
    obey pam restrictions = yes

[CompanyShared]
    comment = Shared company files
    path = /srv/leanops-shares/company-shared
    valid users = @leanops-users
    read only = no
    access based share enum = yes
    force group = leanops-users
    create mask = 0660
    force create mode = 0660
    directory mask = 02770
    force directory mode = 02770

[Operations]
    comment = Operations department files
    path = /srv/leanops-shares/operations
    valid users = @operations
    read only = no
    access based share enum = yes
    force group = operations
    create mask = 0660
    force create mode = 0660
    directory mask = 02770
    force directory mode = 02770

[Management]
    comment = Management department files
    path = /srv/leanops-shares/management
    valid users = @management
    read only = no
    access based share enum = yes
    force group = management
    create mask = 0660
    force create mode = 0660
    directory mask = 02770
    force directory mode = 02770

[Private]
    comment = Private user files
    path = /srv/leanops-shares/users/%U
    valid users = %U
    read only = no
    access based share enum = yes
    create mask = 0600
    force create mode = 0600
    directory mask = 0700
    force directory mode = 0700
